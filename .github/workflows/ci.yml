name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint / Format / Types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install
        uses: ./.github/composite-actions/install

      - name: Build
        run: pnpm build

      - name: Run check (fmt + lint + typecheck)
        run: pnpm check

      - name: Validate published package (exports / types)
        run: pnpm check:package

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install
        uses: ./.github/composite-actions/install

      - name: Build (snapshots load from dist)
        run: pnpm build

      - name: Run tests
        run: pnpm test

  change-intent:
    name: Change intent
    # Renovate PRs and the release PR carry no change intent by design, but
    # oxc bumps (labeled `oxc-update`) change the effective rule set, so they
    # must carry an intent documenting the new/changed rules.
    if: >-
      github.head_ref != 'pnpm-release/main' &&
      (github.actor != 'renovate[bot]' ||
       contains(github.event.pull_request.labels.*.name, 'oxc-update'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify a change intent is present
        run: |
          git diff --name-only "origin/${GITHUB_BASE_REF}"...HEAD \
            | grep -E '^\.changeset/[^/]+\.md$' \
            | grep -v '^\.changeset/README\.md$'
