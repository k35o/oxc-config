blockExoticSubdeps: true

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@k8o/*'
  - 'vite-plus-inspector'

strictDepBuilds: true

allowBuilds:
  esbuild: false
  # wranglerの依存。画像最適化用だが pages deploy では不要
  sharp: false
  # wranglerの依存。pages deployはAPIアップロードのみでworkerd実行は不要
  workerd: false

verifyDepsBeforeRun: install

saveExact: true
autoInstallPeers: false

versioning:
  changelog:
    storage: repository

# vite-plus は oxlint / oxfmt / oxlint-tsgolint を process.cwd() 起点の
# require.resolve で探し、見つからなければ親ディレクトリを登り続ける。
# .claude/worktrees/ 配下では親チェックアウトの別バージョンを先に拾うため、
# プロジェクト直下に実体へのリンクを置いて、そこで解決を止める。
publicHoistPattern:
  - oxlint
  - oxfmt
  - oxlint-tsgolint
