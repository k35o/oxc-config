blockExoticSubdeps: true

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@k8o/*'
  - 'vite-plus-inspector'
  # Renovate security update: vite-plus@1.3.0
  - vite-plus@1.3.0

strictDepBuilds: true

allowBuilds:
  esbuild: false
  # wranglerの依存。画像最適化用だが pages deploy では不要
  sharp: false
  # wranglerの依存。pages deployはAPIアップロードのみでworkerd実行は不要
  workerd: false

verifyDepsBeforeRun: install

saveExact: true
autoInstallPeers: false

versioning:
  changelog:
    storage: repository

# vite-plus は oxlint / oxfmt を process.cwd() 起点の require.resolve で探し、
# 見つからなければ親ディレクトリを登り続ける。
# .claude/worktrees/ 配下では親チェックアウトの別バージョンを先に拾うため、
# プロジェクト直下に実体へのリンクを置いて、そこで解決を止める。
# tsrs は vite-plus 自身の場所から先に解決されるので、ここには要らない。
publicHoistPattern:
  - oxlint
  - oxfmt

# tsrs は仮置きの 0.0.0-bootstrap.0 だけが staged publish で、以降の CI 公開
# （trusted publishing）がすべて格下げ扱いになる。乗っ取りではなく公開方式の差。
trustPolicyExclude:
  - tsrs
