blockExoticSubdeps: true

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@k8o/*'
  - 'vite-plus-inspector'
  # pnpm はグロブにバージョンを併記できないため、プラットフォームバイナリは
  # スコープごと通す。親の exact pin 経由でしか解決されないので、実質の
  # ゲートはバージョン固定した親が担う。
  - 'vite-plus@1.0.0'
  - '@voidzero-dev/*'
  - 'oxlint-tsgolint@7.0.2003'
  - '@oxlint-tsgolint/*'

# vitest は vite に直接依存するため、放っておくと vite-plus とは別に素の vite と
# rolldown が入る。overrides で vite-plus が同梱するものに寄せる。2 つのバージョンは
# 必ず一致させるので、並べて置く。
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0

overrides:
  vite: 'catalog:'

strictDepBuilds: true

allowBuilds:
  esbuild: false
  # wranglerの依存。画像最適化用だが pages deploy では不要
  sharp: false
  # wranglerの依存。pages deployはAPIアップロードのみでworkerd実行は不要
  workerd: false

verifyDepsBeforeRun: install

saveExact: true
autoInstallPeers: false

versioning:
  changelog:
    storage: repository
